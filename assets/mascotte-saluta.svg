<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Nuvia">
  <style>
    @keyframes float-saluta { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    @keyframes blink-saluta { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
    .mascot-body-saluta { animation: float-saluta 3.5s ease-in-out infinite; }
    .eyes-saluta { animation: blink-saluta 4s infinite; transform-origin: 150px 185px; }
  
    /* IL RESPIRO — 1,5%: sotto la soglia di ciò che si nota, sopra
       quella di ciò che si sente. È questo che separa un
       personaggio da un disegno. */
    @keyframes respiro-saluta{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,0.99)}}
    .respira-saluta{animation:respiro-saluta 4.1s ease-in-out infinite;transform-origin:150px 280px}
    /* L'AMMICCO — due periodi non multipli (4,3 e 7,1 s) così
       l'occhio non trova mai il ritmo: un blink regolare è la cosa
       più inquietante che si possa fare a una faccia. */
    @keyframes ammicco-saluta{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.08)}}
    @keyframes ammicco2-saluta{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(0.12)}}
    .occhi-saluta{animation:ammicco-saluta 4.3s infinite,ammicco2-saluta 7.1s infinite;
      transform-origin:150px 185px}

    /* LO SGUARDO — le pupille si spostano appena: chi guarda sente
       che la mascotte sta guardando qualcosa, non il vuoto. */
    @keyframes sguardo-saluta{0%,40%{transform:translate(0,0)}
      50%,70%{transform:translate(2px,-1px)}80%,100%{transform:translate(-1px,1px)}}
    .pupille-saluta{animation:sguardo-saluta 8.9s ease-in-out infinite}

    /* la mano che saluta: piccola, alterna, mai frenetica */
    @keyframes mano-saluta{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(12deg)}}
    .braccio-saluta{animation:mano-saluta 1.9s ease-in-out infinite;transform-origin:226px 152px}
    /* LE SOPRACCIGLIA — è qui che vive l'espressione. Due linee
       corte che si alzano di due gradi cambiano l'umore di una
       faccia più di qualunque altra cosa: il cinema d'animazione
       lo sa da cent'anni. */
    @keyframes so-saluta{0%,88%,100%{transform:translateY(0)}92%{transform:translateY(-3px)}}
    .sopracciglia-saluta{animation:so-saluta 5.7s ease-in-out infinite;transform-origin:150px 159px}
    /* LA BOCCA si muove POCO e con un periodo diverso da tutto
       il resto: se battesse a tempo col respiro sembrerebbe un
       meccanismo, non una creatura. */
    @keyframes bocca-saluta{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,1.1)}}
    .bocca-saluta{animation:bocca-saluta 5.3s ease-in-out infinite;transform-origin:150px 223px}
    /* IL DONDOLIO — un grado e mezzo, lentissimo: nessuno lo nota
       guardando, tutti lo notano se manca. */
    @keyframes ondeggio-saluta{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
    .ondeggia-saluta{animation:ondeggio-saluta 6.7s ease-in-out infinite;transform-origin:150px 280px}
    /* LA TESTA che accompagna il saluto: due gradi, in fase con
       la mano. Un saluto col corpo immobile è un braccio che si
       muove da solo. */
    @keyframes testa-saluta{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
    .corpo-saluta{animation:testa-saluta 1.9s ease-in-out infinite;transform-origin:150px 260px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    <linearGradient id="tealGrad-saluta" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00E0C6" /><stop offset="100%" stop-color="#00AFA3" /></linearGradient>
    <linearGradient id="coralGrad-saluta" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFA07A" /><stop offset="100%" stop-color="#FF7F50" /></linearGradient>
  </defs>
  <g class="ondeggia-saluta"><g class="respira-saluta"><g class="corpo-saluta"><g class="mascot-body-saluta">
    <path d="M 150,140 C 170,70 220,70 220,120 C 220,150 170,160 150,140" fill="url(#coralGrad-saluta)"/>
    <path d="M 70,230 C 70,140 110,130 150,130 C 190,130 230,140 230,230 C 230,280 190,280 150,280 C 110,280 70,280 70,230" fill="url(#tealGrad-saluta)"/>
    <g class="occhi-saluta">
      <circle cx="120" cy="185" r="8" fill="#1A4D40"/><circle cx="180" cy="185" r="8" fill="#1A4D40"/>
      <g class="pupille-saluta"><circle cx="123" cy="182" r="3" fill="#FFFFFF"/><circle cx="183" cy="182" r="3" fill="#FFFFFF"/></g>
    </g>
    
    
      <g class="braccio-saluta"><path d="M 224,150 q 16,-14 26,-4 q 8,8 -6,18"
      fill="none" stroke="url(#tealGrad-saluta)" stroke-width="13" stroke-linecap="round"/></g>
    <g class="sopracciglia-saluta" opacity=".85"><path d="M 111 159 q 9 -5 18 0" stroke="#1A4D40" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M 171 159 q 9 -5 18 0" stroke="#1A4D40" stroke-width="4" stroke-linecap="round" fill="none"/></g>
    <path class="bocca-saluta" d="M 138 223 q 12 10 24 0" stroke="#1A4D40" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g></g></g></g>
</svg>
