<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Nuvia">
  <style>
    @keyframes scanMove-cerca { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .mascot-scan-cerca { animation: scanMove-cerca 4s ease-in-out infinite; }
  
    /* IL RESPIRO — 1,5%: sotto la soglia di ciò che si nota, sopra
       quella di ciò che si sente. È questo che separa un
       personaggio da un disegno. */
    @keyframes respiro-cerca{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,0.99)}}
    .respira-cerca{animation:respiro-cerca 4.1s ease-in-out infinite;transform-origin:150px 280px}

    /* la ricerca: lo sguardo spazza a destra e a sinistra */
    @keyframes scruta-cerca{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
    .corpo-cerca{animation:scruta-cerca 3.1s ease-in-out infinite}
    /* LO SGUARDO DI `cerca` È DIVERSO DAGLI ALTRI, apposta. Le altre
       pose si guardano intorno, a destra e a sinistra. Questa NO:
       questa ha una lente in mano, e chi tiene una lente guarda
       DENTRO la lente. Le pupille stanno spostate verso destra — dove
       sta il vetro — e si muovono di tre punti, quel tanto che basta
       a non sembrare dipinte. Le sopracciglia le seguono. */
    @keyframes sguardo-cerca{0%,20%{transform:translateX(6px)}
      40%,60%{transform:translateX(3px)}80%,100%{transform:translateX(6px)}}
    .pupille-cerca{animation:sguardo-cerca 6.2s ease-in-out infinite}
    @keyframes so-cerca{0%,20%{transform:translate(2px,-1px) rotate(1.5deg)}
      40%,60%{transform:translate(0,0) rotate(0)}80%,100%{transform:translate(2px,-1px) rotate(1.5deg)}}
    .sopracciglia-cerca{animation:so-cerca 6.2s ease-in-out infinite;transform-origin:150px 164px}
    /* LA BOCCA si muove POCO e con un periodo diverso da tutto
       il resto: se battesse a tempo col respiro sembrerebbe un
       meccanismo, non una creatura. */
    @keyframes bocca-cerca{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,1.1)}}
    .bocca-cerca{animation:bocca-cerca 5.3s ease-in-out infinite;transform-origin:150px 228px}
    /* IL DONDOLIO — un grado e mezzo, lentissimo: nessuno lo nota
       guardando, tutti lo notano se manca. */
    @keyframes ondeggio-cerca{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
    .ondeggia-cerca{animation:ondeggio-cerca 6.7s ease-in-out infinite;transform-origin:150px 280px}
    /* LA LENTE si muove appena, sullo STESSO periodo dello sguardo:
       se andasse per conto suo, gli occhi e la lente guarderebbero
       due cose diverse e nessuno dei due sembrerebbe cercare. */
    @keyframes lente-cerca{0%,20%{transform:translate(0,0) rotate(0)}
      40%,60%{transform:translate(-4px,3px) rotate(-4deg)}
      80%,100%{transform:translate(0,0) rotate(0)}}
    .lente-cerca{animation:lente-cerca 6.2s ease-in-out infinite;transform-origin:235px 232px}
    /* L'AMMICCO — arrivato per ultimo, il 25/08, su richiesta del
       founder: era l'unica posa che non sbatteva le palpebre. Due
       periodi non multipli (4,3 e 7,1 s) così l'occhio non trova mai
       il ritmo. Le pupille stanno DENTRO il gruppo: si chiudono con
       l'occhio. Gli occhi di questa posa stanno a y 190, non 185. */
    @keyframes ammicco-cerca{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.08)}}
    @keyframes ammicco2-cerca{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(0.12)}}
    .occhi-cerca{animation:ammicco-cerca 4.3s infinite,ammicco2-cerca 7.1s infinite;
      transform-origin:150px 190px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    <linearGradient id="tealGrad-cerca" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00E0C6" /><stop offset="100%" stop-color="#00AFA3" /></linearGradient>
    <linearGradient id="coralGrad-cerca" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFA07A" /><stop offset="100%" stop-color="#FF7F50" /></linearGradient>
  </defs>
  <g class="ondeggia-cerca"><g class="respira-cerca"><g class="corpo-cerca"><g class="mascot-scan-cerca">
    <path d="M 150,140 C 170,70 220,70 220,120 C 220,150 170,160 150,140" fill="url(#coralGrad-cerca)"/>
    <path d="M 70,230 C 70,140 110,130 150,130 C 190,130 230,140 230,230 C 230,280 190,280 150,280 C 110,280 70,280 70,230" fill="url(#tealGrad-cerca)"/>
    <g class="occhi-cerca"><circle cx="120" cy="190" r="11" fill="#1A4D40"/><circle cx="180" cy="190" r="11" fill="#1A4D40"/><g class="pupille-cerca"><circle cx="120" cy="188" r="3.5" fill="#FFFFFF"/><circle cx="180" cy="188" r="3.5" fill="#FFFFFF"/></g></g>
      <g class="sopracciglia-cerca" opacity=".85"><path d="M 111 165 q 9 -6 18 -1" stroke="#1A4D40" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M 171 165 q 9 -1 18 -6" stroke="#1A4D40" stroke-width="4" stroke-linecap="round" fill="none"/></g>
    <path class="bocca-cerca" d="M 143 228 q 7 6 14 0" stroke="#1A4D40" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g></g></g></g>
  <g class="lente-cerca">
    <path d="M 248,218 L 235,232" stroke="#1A4D40" stroke-width="10" stroke-linecap="round"/>
    <circle cx="266" cy="197" r="22" fill="#FFFFFF" opacity=".55"/>
    <circle cx="266" cy="197" r="22" fill="none" stroke="#1A4D40" stroke-width="6"/></g>
</svg>
