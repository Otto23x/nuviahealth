<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Nuvia">
  <style>
    @keyframes heavyBreath-sport { 0%, 100% { transform: translateY(0px) scaleY(1); } 50% { transform: translateY(-4px) scaleY(1.02); } }
    .mascot-sport-sport { animation: heavyBreath-sport 1.2s ease-in-out infinite; transform-origin: 150px 280px; }
  
    /* IL RESPIRO — 1,5%: sotto la soglia di ciò che si nota, sopra
       quella di ciò che si sente. È questo che separa un
       personaggio da un disegno. */
    @keyframes respiro-sport{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,0.99)}}
    /* il respiro di questa posa è definito più sotto (affanno):
       chi si allena non respira come chi riposa. */
    .respira-sport{transform-origin:150px 280px}
    /* L'AMMICCO — due periodi non multipli (4,3 e 7,1 s) così
       l'occhio non trova mai il ritmo: un blink regolare è la cosa
       più inquietante che si possa fare a una faccia. */
    @keyframes ammicco-sport{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.08)}}
    @keyframes ammicco2-sport{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(0.12)}}
    .occhi-sport{animation:ammicco-sport 4.3s infinite,ammicco2-sport 7.1s infinite;
      transform-origin:150px 185px}

    /* il fiatone: veloce, e con una pausa che lo rende umano */
    @keyframes fiato-sport{0%,100%{transform:scale(1,1)}
      45%{transform:scale(1.025,0.98)}60%{transform:scale(1.01,0.995)}}
    .corpo-sport{animation:fiato-sport 1.6s ease-in-out infinite;transform-origin:150px 280px}
    /* LE SOPRACCIGLIA — è qui che vive l'espressione. Due linee
       corte che si alzano di due gradi cambiano l'umore di una
       faccia più di qualunque altra cosa: il cinema d'animazione
       lo sa da cent'anni. */
    @keyframes so-sport{0%,100%{transform:translateY(0)}50%{transform:translateY(1.5px)}}
    .sopracciglia-sport{animation:so-sport 1.4s ease-in-out infinite;transform-origin:150px 164px}
    /* LA BOCCA si muove POCO e con un periodo diverso da tutto
       il resto: se battesse a tempo col respiro sembrerebbe un
       meccanismo, non una creatura. */
    @keyframes bocca-sport{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,1.1)}}
    .bocca-sport{animation:bocca-sport 5.3s ease-in-out infinite;transform-origin:150px 228px}
    /* IL DONDOLIO — un grado e mezzo, lentissimo: nessuno lo nota
       guardando, tutti lo notano se manca. */
    @keyframes ondeggio-sport{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
    .ondeggia-sport{animation:ondeggio-sport 6.7s ease-in-out infinite;transform-origin:150px 280px}
    /* LA GOCCIA DI SUDORE: parte, scende, sparisce. Compare ogni
       tre secondi e mezzo, non di continuo — una goccia perenne
       non è fatica, è un rubinetto. */
    /* LA GOCCIA cade DRITTA. Prima aveva quattro punti di deriva a
       destra e — peggio — stava fuori dai gruppi del corpo: la testa
       ondeggiava e respirava, lei restava ferma nel riquadro, e quella
       differenza si leggeva come uno scivolamento di lato. Adesso sta
       dentro la faccia e scende in verticale, come fa il sudore. */
    @keyframes goccia-sport{0%,55%{transform:translate(0,0) scale(.4);opacity:0}
      62%{transform:translate(0,0) scale(1);opacity:.9}
      100%{transform:translate(0,44px) scale(.7);opacity:0}}
    .goccia-sport{animation:goccia-sport 3.4s ease-in infinite;transform-origin:205px 174px}
    /* IL RESPIRO CORTO di chi si sta allenando: più veloce del
       respiro di riposo delle altre pose. */
    @keyframes affanno-sport{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.975)}}
    .respira-sport{animation:affanno-sport 1.9s ease-in-out infinite}
    /* IL MANUBRIO si alza e si abbassa sul tempo del fiatone (1,6 s):
       è lo sforzo a dettare il respiro, non il contrario. Il rollio
       di due gradi evita che sembri un ascensore. */
    /* IL MANUBRIO si alza e si abbassa: ventidue punti, che alla
       misura di resa sono un movimento che si vede. Sul tempo del
       fiatone (1,6 s), perché è lo sforzo a dettare il respiro. Il
       grado e mezzo di rollio serve solo a non farlo sembrare un
       ascensore. */
    @keyframes pesi-sport{0%,100%{transform:translateY(4px) rotate(-1.5deg)}
      50%{transform:translateY(-18px) rotate(1.5deg)}}
    .pesi-sport{animation:pesi-sport 1.6s ease-in-out infinite;transform-origin:108px 111px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    <linearGradient id="tealGrad-sport" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00E0C6" /><stop offset="100%" stop-color="#00AFA3" /></linearGradient>
    <linearGradient id="coralGrad-sport" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFA07A" /><stop offset="100%" stop-color="#FF7F50" /></linearGradient>
  </defs>
  <g class="ondeggia-sport"><g class="respira-sport"><g class="corpo-sport"><g class="mascot-sport-sport">
    <path d="M 150,140 C 170,70 220,70 220,120 C 220,150 170,160 150,140" fill="url(#coralGrad-sport)"/>
    <path d="M 70,230 C 70,140 110,130 150,130 C 190,130 230,140 230,230 C 230,280 190,280 150,280 C 110,280 70,280 70,230" fill="url(#tealGrad-sport)"/>
    <g class="occhi-sport"><circle cx="120" cy="190" r="7" fill="#1A4D40"/><circle cx="180" cy="190" r="7" fill="#1A4D40"/><g class="pupille-sport"><circle cx="120" cy="188" r="2.5" fill="#FFFFFF"/><circle cx="180" cy="188" r="2.5" fill="#FFFFFF"/></g></g>
    <line x1="105" y1="180" x2="130" y2="185" stroke="#1A4D40" stroke-width="4" stroke-linecap="round"/>
    <line x1="195" y1="180" x2="170" y2="185" stroke="#1A4D40" stroke-width="4" stroke-linecap="round"/>
      <g class="sopracciglia-sport"><path d="M 106 156 L 132 170" stroke="#1A4D40" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M 194 156 L 168 170" stroke="#1A4D40" stroke-width="6" stroke-linecap="round" fill="none"/></g>
    <path class="bocca-sport" d="M 140 228 q 10 12 20 0" stroke="#1A4D40" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path class="goccia-sport" d="M 205 168 q 5 8 0 12 q -5 -4 0 -12" fill="#00E0C6" opacity=".9"/>
  </g></g></g></g>
  <g class="pesi-sport">
    <rect x="90" y="106" width="36" height="9" rx="4.5" fill="#1A4D40"/>
    <rect x="76" y="94" width="15" height="34" rx="7" fill="url(#coralGrad-sport)"/>
    <rect x="125" y="94" width="15" height="34" rx="7" fill="url(#coralGrad-sport)"/>
    <rect x="66" y="101" width="10" height="20" rx="5" fill="#1A4D40" opacity=".9"/>
    <rect x="140" y="101" width="10" height="20" rx="5" fill="#1A4D40" opacity=".9"/></g>
</svg>
