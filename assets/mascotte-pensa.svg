<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Nuvia">
  <style>
    @keyframes gentleFloat-pensa { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    @keyframes thinkTwitch-pensa { 0%, 80%, 100% { transform: rotate(0deg); } 85% { transform: rotate(4deg); } 90% { transform: rotate(-4deg); } 95% { transform: rotate(2deg); } }
    .mascot-pensa-pensa { animation: gentleFloat-pensa 4s ease-in-out infinite; }
    .leaf-antenna-pensa { animation: thinkTwitch-pensa 3s infinite; transform-origin: 150px 140px; }
  
    /* IL RESPIRO — 1,5%: sotto la soglia di ciò che si nota, sopra
       quella di ciò che si sente. È questo che separa un
       personaggio da un disegno. */
    @keyframes respiro-pensa{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,0.99)}}
    .respira-pensa{animation:respiro-pensa 4.1s ease-in-out infinite;transform-origin:150px 280px}
    /* L'AMMICCO — due periodi non multipli (4,3 e 7,1 s) così
       l'occhio non trova mai il ritmo: un blink regolare è la cosa
       più inquietante che si possa fare a una faccia. */
    @keyframes ammicco-pensa{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.08)}}
    @keyframes ammicco2-pensa{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(0.12)}}
    .occhi-pensa{animation:ammicco-pensa 4.3s infinite,ammicco2-pensa 7.1s infinite;
      transform-origin:150px 185px}


    /* il pensiero: la testa si inclina di lato e resta lì un attimo */
    @keyframes rimugina-pensa{0%,60%,100%{transform:rotate(0)}75%{transform:rotate(-5deg)}}
    .corpo-pensa{animation:rimugina-pensa 6.7s ease-in-out infinite;transform-origin:150px 260px}
    /* LO SGUARDO — sinistra, pausa, destra, pausa. È la pausa a fare
       la differenza fra guardarsi intorno e agitarsi. Le sopracciglia
       girano sullo STESSO periodo e nella stessa direzione: senza di
       loro le pupille scivolano e la faccia resta inespressiva. */
    @keyframes sguardo-pensa{0%,16%{transform:translateX(0)}28%,42%{transform:translateX(-4px)}54%,68%{transform:translateX(4px)}80%,100%{transform:translateX(0)}}
    .pupille-pensa{animation:sguardo-pensa 7.4s ease-in-out infinite}
    @keyframes so-pensa{0%,16%{transform:translate(0,0) rotate(0)}28%,42%{transform:translate(-2px,-2px) rotate(-2deg)}54%,68%{transform:translate(2px,-2px) rotate(2deg)}80%,100%{transform:translate(0,0) rotate(0)}}
    .sopracciglia-pensa{animation:so-pensa 7.4s ease-in-out infinite;transform-origin:150px 159px}
    /* LA BOCCA si muove POCO e con un periodo diverso da tutto
       il resto: se battesse a tempo col respiro sembrerebbe un
       meccanismo, non una creatura. */
    @keyframes bocca-pensa{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,1.1)}}
    .bocca-pensa{animation:bocca-pensa 5.3s ease-in-out infinite;transform-origin:150px 223px}
    /* IL DONDOLIO — un grado e mezzo, lentissimo: nessuno lo nota
       guardando, tutti lo notano se manca. */
    @keyframes ondeggio-pensa{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
    .ondeggia-pensa{animation:ondeggio-pensa 7.3s ease-in-out infinite;transform-origin:150px 280px}
    /* I TRE PUNTINI dentro la nuvoletta si accendono in fila: uno,
       due, tre, e ricomincia. Il ritmo dice «sto ancora pensando».
       Restano dentro il fumetto: sparsi sopra la testa erano tre
       pallini e basta, e infatti non si capivano. */
    @keyframes p1-pensa{0%,20%{opacity:.2}35%,100%{opacity:1}}
    @keyframes p2-pensa{0%,40%{opacity:.2}55%,100%{opacity:1}}
    @keyframes p3-pensa{0%,60%{opacity:.2}75%,100%{opacity:1}}
    .p1-pensa{animation:p1-pensa 2.8s ease-in-out infinite}
    .p2-pensa{animation:p2-pensa 2.8s ease-in-out infinite}
    .p3-pensa{animation:p3-pensa 2.8s ease-in-out infinite}
    /* la nuvoletta respira appena, su un periodo suo */
    @keyframes nuvoletta-pensa{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
    .nuvoletta-pensa{animation:nuvoletta-pensa 4.1s ease-in-out infinite;transform-origin:266px 116px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    <linearGradient id="tealGrad-pensa" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00E0C6" /><stop offset="100%" stop-color="#00AFA3" /></linearGradient>
    <linearGradient id="coralGrad-pensa" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFA07A" /><stop offset="100%" stop-color="#FF7F50" /></linearGradient>
  </defs>
  <g class="ondeggia-pensa"><g class="respira-pensa"><g class="corpo-pensa"><g class="mascot-pensa-pensa">
    <path class="leaf-antenna-pensa" d="M 150,140 C 170,70 220,70 220,120 C 220,150 170,160 150,140" fill="url(#coralGrad-pensa)"/>
    <path d="M 70,230 C 70,140 110,130 150,130 C 190,130 230,140 230,230 C 230,280 190,280 150,280 C 110,280 70,280 70,230" fill="url(#tealGrad-pensa)"/>
    <g class="occhi-pensa"><circle cx="125" cy="185" r="8" fill="#1A4D40"/><circle cx="185" cy="185" r="8" fill="#1A4D40"/><g class="pupille-pensa"><circle cx="125" cy="183" r="3" fill="#FFFFFF"/><circle cx="185" cy="183" r="3" fill="#FFFFFF"/></g></g>
      <g class="sopracciglia-pensa" opacity=".85"><path d="M 116 161 q 9 -7 18 -2" stroke="#1A4D40" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M 176 159 q 9 -2 18 -7" stroke="#1A4D40" stroke-width="4" stroke-linecap="round" fill="none"/></g>
    <path class="bocca-pensa" d="M 143 223 q 7 6 14 0" stroke="#1A4D40" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g></g></g></g>
  <g class="nuvoletta-pensa">
    <g fill="#1A4D40" opacity=".42">
      <circle cx="250" cy="112" r="16"/><circle cx="268" cy="106" r="20"/><circle cx="283" cy="113" r="14"/>
      <circle cx="240" cy="146" r="6.5"/><circle cx="232" cy="164" r="4.5"/></g>
    <g fill="#FFFFFF">
      <circle cx="250" cy="112" r="12.5"/><circle cx="268" cy="106" r="16.5"/><circle cx="283" cy="113" r="10.5"/>
      <circle cx="240" cy="146" r="4"/><circle cx="232" cy="164" r="2.6"/></g>
    <g fill="#1A4D40" opacity=".68">
      <circle class="p1-pensa" cx="255" cy="110" r="3.6"/>
      <circle class="p2-pensa" cx="268" cy="110" r="3.6"/>
      <circle class="p3-pensa" cx="281" cy="110" r="3.6"/></g></g>
</svg>
